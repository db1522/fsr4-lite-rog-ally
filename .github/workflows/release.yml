# Builds and publishes the widget. Publish a release with a new tag like v0.1.0 and the download
# (FSR4Lite_x64.zip) is attached to it a few minutes later. No setup, no local Visual Studio.
# Signing: with the SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD secrets set, every build is signed with that one permanent
# "CN=ROG Ally Life" certificate, so players approve it once, ever. Without them, each build gets a fresh certificate.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # "Run workflow" button for a test build without a release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Load the permanent signing certificate
        shell: powershell
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:SIGNING_PFX) {
              Write-Host 'No permanent certificate in the repository secrets; this build gets a fresh one.'
              exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          if ($cert.Subject -ne 'CN=ROG Ally Life') { throw "The certificate is for '$($cert.Subject)', not CN=ROG Ally Life." }
          Write-Host "Signing with the permanent certificate $($cert.Thumbprint)"

      - name: Build and sign
        shell: powershell
        run: |
          # Releases use their tag. Test runs ("Run workflow") get 0.0.<run number>, unique for every run, because
          # Windows refuses a package with the same version as the installed one but different contents.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$($env:GITHUB_RUN_NUMBER)" }
          .\scripts\build.ps1 -Version $version

      - name: Keep the build (test runs)
        uses: actions/upload-artifact@v4
        with:
          name: FSR4Lite_x64
          path: dist/FSR4Lite_x64.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FSR4Lite_x64.zip
          generate_release_notes: true
